services:
  - type: web
    name: coros-run-agent-api
    runtime: python
    region: singapore
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: APP_ENV
        value: prod
      - key: TIMEZONE
        value: Asia/Shanghai
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: CORS_ORIGINS
        value: https://jovial-meringue-21dbdf.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: coros-run-agent-db
          property: connectionString
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REFRESH_TOKEN
        sync: false
      - key: STRAVA_ATHLETE_ID
        sync: false
      - key: STRAVA_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: STRAVA_WEBHOOK_CALLBACK_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_SSL
        value: "false"
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: DEFAULT_REMINDER_HOUR
        value: "19"
      - key: DEFAULT_REMINDER_MINUTE
        value: "0"

databases:
  - name: coros-run-agent-db
    plan: free
    databaseName: corosrunagent
    user: corosrunagent
